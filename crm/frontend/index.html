<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<title>CRM - CreatingaDev</title>
		<meta name="description" content="Customer Relationship Management (CRM) application for CreatingaDev." />
		<link rel="icon" href="/favicon.ico" />
		<!-- Add your CSS files below -->
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<header>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-square-terminal-icon lucide-square-terminal"><path d="m7 11 2-2-2-2"/><path d="M11 13h4"/><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/></svg>
			<div>Daily Standup</div>
            <div>V1.0 - Sprint 1</div>
		</header><hr />

		<main>
            <h2 id="live-thought-layer">Live Thought Layer</h2>
            
            <!-- Content added here -->
            <div class="card">
                <ul>
                    <li class="card-stat">
                        <div class="card-label task-intent">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sticky-note-plus-icon lucide-sticky-note-plus"><path d="M15 3v5a1 1 0 0 0 1 1h5"/><path d="M18 15v6"/><path d="M21 12.356V9a2.4 2.4 0 0 0-.706-1.706l-3.588-3.588A2.4 2.4 0 0 0 15 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7.355"/><path d="M21 18h-6"/></svg>
                            <div class="cl-text">Task Intent:</div>
                        </div>
                    </li>
                    <p>Recreate Adobe Stock model in Blender</p>

                    <li class="card-stat">
                        <div class="card-label task-constraint">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-alarm-clock-check-icon lucide-alarm-clock-check"><circle cx="12" cy="13" r="8"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/><path d="M6.38 18.7 4 21"/><path d="M17.64 18.67 20 21"/><path d="m9 13 2 2 4-4"/></svg>
                            <div class="cl-text">Constraint:</div>
                        </div>
                    </li>
                    <p>Provided with .mdl, .mtl, and .obj files</p>

                    <li class="card-stat">
                        <div class="card-label task-next-action">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-list-todo-icon lucide-list-todo"><path d="M13 5h8"/><path d="M13 12h8"/><path d="M13 19h8"/><path d="m3 17 2 2 4-4"/><rect x="3" y="4" width="6" height="6" rx="1"/></svg>
                            <div class="cl-text">Next Action:</div>
                        </div>
                    </li>
                    <p>Import models into Blender and apply materials</p>
                </ul>
            </div>
		</main>

		<footer>
			<small>&copy; "CreatingaModernDev"</small>
		</footer>

		<!-- Add your JS files below -->
		<script src="scripts.js"></script>
    </body>
</html>
